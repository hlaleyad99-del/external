<script>
const main=document.getElementById('main');
// العنصر #points يُعاد إنشاؤه عند كل updateLoginUI، لذلك نقرؤه في كل مرة بدل تخزين مرجع قديم
const points={get textContent(){return (document.getElementById('points')||{}).textContent||''},set textContent(v){const e=document.getElementById('points');if(e)e.textContent=v}};
const savedLang=localStorage.getItem('alhilal_ui_language')||'العربية';
let state={page:'home',projects:[],lang:savedLang};
try{state.projects=localStorage.getItem('alhilal_auth_token')?JSON.parse(localStorage.getItem('alhilal_projects')||'[]'):[]}catch(e){state.projects=[]}
function persistProjects(){try{localStorage.setItem('alhilal_projects',JSON.stringify(state.projects))}catch(e){console.warn('project storage',e)}}
function stripProjectBinaries(value){if(Array.isArray(value))return value.map(stripProjectBinaries);if(value&&typeof value==='object'){const o={};for(const [k,v] of Object.entries(value)){if(['audioBase64','blobUrl'].includes(k))continue;if(typeof v==='string'&&v.startsWith('data:'))continue;o[k]=stripProjectBinaries(v)}return o}return value}
function legacy_addProjectRecord(type,name,desc,data,icon='📁'){const safeData=stripProjectBinaries(data||null);const rec={id:'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),type,name:name||'مشروع الهلال AI',date:new Date().toLocaleString('ar-EG'),desc:desc||'',icon,data:safeData};state.projects.unshift(rec);persistProjects();return rec}
function projectTypeLabel(t){return ({director:'المخرج الذكي',story:'قصة / بطاقة قصة',voice:'تعليق صوتي',image:'صورة',video:'فيديو',chat:'محادثة'})[t]||'مشروع'}
function openProjectRecord(i){const p=state.projects[i];if(!p)return;document.getElementById('projectViewer')?.remove();const v=document.createElement('div');v.className='viewer';v.id='projectViewer';let body='';try{if(p.type==='director'){const d=normalizeDirectorData(p.data?.data||p.data||{});body=directorSceneText(d)+'\n\n'+directorCharactersText(d)+'\n\n'+directorWorldText(d)}else if(p.type==='story'){const d=normalizeStoryData(p.data?.data||p.data||{});body=storyScenesText(d)+'\n\nالشخصيات\n'+storyCharactersText(d)+'\n\nالأماكن\n'+storyLocationsText(d)}else if(p.type==='voice'){body='النص:\n'+(p.data?.text||'')+'\n\nالصوت: '+(p.data?.voice||'')+'\nالنموذج: '+(p.data?.model||'')}else if(p.type==='image'){body='وصف الصورة:\n'+(p.data?.prompt||'')+'\n\nالنسبة: '+(p.data?.ratio||'')}else if(p.type==='video'){body='وصف الفيديو:\n'+(p.data?.prompt||'')+'\n\nالنموذج: '+(p.data?.model||'')+'\nالمدة: '+(p.data?.duration||p.data?.durationSeconds||'')+' ثانية\nالدقة: '+(p.data?.resolution||'')}else{body=typeof p.data==='string'?p.data:JSON.stringify(p.data||{},null,2)}}catch(e){body=JSON.stringify(p.data||{},null,2)}const img=(p.type==='image'&&/^https?:/i.test(p.data?.src||''))?`<img class="ai-image" src="${escapeHtml(p.data.src)}" alt="">`:'';const fname=String(p.name||'project').replace(/[^\w\u0600-\u06FF\-]+/g,'_');v.innerHTML=`<div class="viewer-card"><div class="viewer-head"><h3>${escapeHtml(p.name)}</h3><button class="viewer-close" type="button" id="pvClose">إغلاق</button></div><div class="viewer-body"><div class="viewer-section"><div class="generated-badge">${projectTypeLabel(p.type)} • ${escapeHtml(p.date||'')}</div>${img}<pre class="viewer-pre">${escapeHtml(body)}</pre></div><div class="mini-actions"><button type="button" class="gold" id="pvDownload">💾 تنزيل الملف</button><button type="button" id="pvPrint">🖨️ طباعة / PDF</button>${p.type==='director'||p.type==='story'?`<button type="button" class="gold" id="pvVideo">🎬 إنشاء فيديو من المشروع — مشهدان / حتى 40 ثانية</button>`:''}${['voice','image','video'].includes(p.type)?`<button type="button" id="pvOpen">فتح الأداة</button>`:''}</div></div></div>`;document.body.appendChild(v);v.addEventListener('click',e=>{if(e.target===v)v.remove()});v.querySelector('#pvClose').onclick=()=>v.remove();v.querySelector('#pvDownload').onclick=()=>downloadTextFile(fname+'.txt',body);v.querySelector('#pvPrint').onclick=()=>printStoryFile(p.name,body);const pv=v.querySelector('#pvVideo');if(pv)pv.onclick=()=>openVideoFromProject(i);const po=v.querySelector('#pvOpen');if(po)po.onclick=()=>{v.remove();nav(p.type)}}
function openVideoFromProject(i){const p=state.projects[i];if(!p){return}let prompt='',sceneCount=2;if(p.type==='director'){const d=p.data?.data||p.data||{};const scenes=Array.isArray(d.scenes)?d.scenes.slice(0,2):[];prompt=scenes.map((s,n)=>`المشهد ${n+1}: ${s.title||''}\nالوصف البصري: ${s.visual||''}\nحركة الكاميرا: ${s.camera||''}\nالحركة: ${s.video_prompt||''}\nالحوار: ${s.dialogue||''}\nالصوت: ${s.sound||''}`).join('\n\n--- انتقال إلى المشهد التالي ---\n\n')}else if(p.type==='story'){const d=p.data?.data||p.data||{};const scenes=Array.isArray(d.dialogue_and_prompts)?d.dialogue_and_prompts.slice(0,2):[];prompt=scenes.map((s,n)=>`المشهد ${n+1}: ${s.scene_title||''}\nالوصف: ${s.scene_description||''}\nالحوار: ${s.dialogue||''}\nVideo Prompt: ${s.video_prompt||''}`).join('\n\n--- انتقال إلى المشهد التالي ---\n\n')}else{alert('زر إنشاء الفيديو من الملف متاح للمخرج الذكي والقصة.');return}if(!prompt.trim()){alert('الملف لا يحتوي على مشاهد كافية لإنشاء فيديو.');return}window.__videoPreset={prompt,sceneCount:2,duration:40};document.getElementById('projectViewer')?.remove();nav('video')}

function applyLocale(){const lang=state.lang||'العربية';const code=LANG_CODES[lang]||'ar';document.documentElement.lang=code;document.documentElement.dir=code==='ar'?'rtl':'ltr';const map=LOCALE_TEXT[lang]||{};if(!Object.keys(map).length)return;const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const n of nodes){const raw=n.nodeValue.trim();if(map[raw])n.nodeValue=n.nodeValue.replace(raw,map[raw]);}document.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(el=>{if(map[el.getAttribute('placeholder')])el.setAttribute('placeholder',map[el.getAttribute('placeholder')])});document.querySelectorAll('[aria-label]').forEach(el=>{if(map[el.getAttribute('aria-label')])el.setAttribute('aria-label',map[el.getAttribute('aria-label')])});}

async function callGemini(prompt,opts={}){
 const key=getGeminiKey();
 if(!key) throw new Error('لم يتم إدخال مفتاح Gemini API من الإعدادات.');
 const preferred=opts.model||getGeminiModel();
 const models=[preferred,...(preferred==='gemini-3.8-flash'?['gemini-3.7-flash']:[])].filter((m,i,a)=>a.indexOf(m)===i);
 let lastError='تعذر الاتصال بـ Gemini API';
 for(const model of models){
  for(let attempt=0;attempt<3;attempt++){
   try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{
     method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},
     body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],...(opts.generationConfig?{generationConfig:opts.generationConfig}:{})})
    });
    const data=await res.json().catch(()=>({}));
    if(res.ok){
      const text=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('\n').trim();
      if(text)return text;
      throw new Error('لم يرجع النموذج نصًا.');
    }
    const status=res.status;
    lastError=data?.error?.message||`خطأ Gemini (${status})`;
    if(status===429||status===500||status===502||status===503||status===504){
      await new Promise(r=>setTimeout(r,1200*(attempt+1)));
      continue;
    }
    break;
   }catch(e){
    lastError=e?.message||lastError;
    if(attempt<2){await new Promise(r=>setTimeout(r,1200*(attempt+1)));continue;}
   }
  }
 }
 throw new Error(lastError+'\nجرّب مرة أخرى بعد قليل إذا كان Gemini تحت ضغط.');
}

}

async function generateGeminiImage(prompt,aspectRatio='1:1'){
 const key=getGeminiKey();
 if(!key)throw new Error('لم يتم إدخال مفتاح Gemini API.');
 const preferred=getGeminiImageModel();
 const models=[preferred,...(preferred==='gemini-3.1-flash-image'?['gemini-3-pro-image']:['gemini-3.1-flash-image'])].filter((m,i,a)=>a.indexOf(m)===i);
 const ratio=aspectRatio==='16:9'?'16:9':'1:1';
 let lastError='تعذر توليد الصورة';
 for(const model of models){
  try{
   const res=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-goog-api-key':key},
    body:JSON.stringify({
      model,
      input:prompt,
      response_format:{type:'image',mime_type:'image/jpeg',aspect_ratio:ratio,image_size:'1K'}
    })
   });
   const data=await res.json().catch(()=>({}));
   if(!res.ok){lastError=data?.error?.message||`خطأ توليد الصورة (${res.status})`;continue}
   const out=data.output_image;
   if(out?.data)return `data:${out.mime_type||out.mimeType||'image/png'};base64,${out.data}`;
   // Defensive fallback for interleaved output shapes.
   for(const step of (data.steps||[])){
    for(const block of (step.content||[])){
     if(block?.type==='image'&&block?.data)return `data:${block.mime_type||'image/png'};base64,${block.data}`;
    }
   }
   lastError='Gemini استجاب لكن لم يُرجع بيانات صورة.';
  }catch(e){lastError=e?.message||lastError}
 }
 throw new Error(lastError);
}

   const img=await generateImageWithFallback(job.prompt,job.kind==='character'?'1:1':'16:9');
   if(job.kind==='character') data.characters[job.index].image_data=img;
   else data.locations[job.index].image_data=img;
  }catch(e){
   failed++;
   if(job.kind==='character') data.characters[job.index].image_error=e?.message||'تعذر توليد الصورة';
   else data.locations[job.index].image_error=e?.message||'تعذر توليد الصورة';
  }finally{
   done++;
   const pct=Math.round((done/Math.max(total,1))*100);
   const bar=document.getElementById('directorImageProgress');
   const status=document.getElementById('directorImageStatus');
   if(bar) bar.style.width=pct+'%';
   if(status) status.textContent=`${done} من ${total} مكتملة — جاري تشغيل حتى صورتين في نفس الوقت`;
  }
 }

 for(let i=0;i<jobs.length;i+=CONCURRENCY){
  await Promise.all(jobs.slice(i,i+CONCURRENCY).map(runJob));
 }
 return {done,failed,total};
}

async function extractPdfText(file){try{if(!window.pdfjsLib){try{window.pdfjsLib=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs')}catch(e){throw new Error('تعذر تحميل قارئ PDF. يمكنك لصق النص يدويًا.')}}const lib=window.pdfjsLib;if(!lib)throw new Error('قارئ PDF غير متاح.');if(lib.GlobalWorkerOptions&&!lib.GlobalWorkerOptions.workerSrc)lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;let out='';for(let i=1;i<=Math.min(pdf.numPages,30);i++){const page=await pdf.getPage(i);const c=await page.getTextContent();out+=`\n[صفحة ${i}]\n`+c.items.map(x=>x.str).join(' ')+'\n'}return out}catch(e){return `\n[ملف PDF: ${file.name}]\nتعذر استخراج النص تلقائيًا: ${e.message}\n`}}

function storyCleanJson(raw){let s=String(raw||'').trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();const a=s.indexOf('{'),b=s.lastIndexOf('}');if(a>=0&&b>a)s=s.slice(a,b+1);try{return JSON.parse(s)}catch(e){throw new Error('النموذج أعاد النتيجة بصيغة غير منظمة. جرّب مرة أخرى أو قلّل طول القصة.')}}

الملخص:
${d.summary||''}`}
function storyScenesText(d){return (d.dialogue_and_prompts||[]).map(s=>`المشهد ${s.scene_number}: ${s.scene_title}

${s.dialogue}

${s.image_prompt}

${s.video_prompt}`).join('\n\n================================\n\n')}
function storyCharactersText(d){return (d.characters||[]).map(c=>`${c.name} — ${c.role}

function storyLocationsText(d){return (d.locations||[]).map(x=>`المكان: ${x.name}

function normalizeStoryData(d){d=d||{};d.dialogue_and_prompts=Array.isArray(d.dialogue_and_prompts)?d.dialogue_and_prompts:(Array.isArray(d.scenes)?d.scenes.map((s,i)=>({scene_number:s.number||i+1,scene_title:s.title||'',scene_description:s.description||'',duration:s.duration||'',dialogue:s.dialogue||'',image_prompt:s.image_prompt||'',video_prompt:s.video_prompt||''})):[]);d.characters=Array.isArray(d.characters)?d.characters:[];d.locations=Array.isArray(d.locations)?d.locations:[];return d}
async function analyzeStory(){const result=document.getElementById('storyResult'),status=document.getElementById('storyStatus');const source=await collectStorySource();if(!source.text){alert(source.images.length?'تحليل الصور وحدها غير مدعوم حاليًا. الصق نص القصة أو ارفع ملف PDF / TXT.':'اكتب القصة كاملة أو ارفع ملف القصة أولًا');return}status.style.display='block';status.textContent='⏳ جاري قراءة القصة كاملة وتقسيمها مثل المخرج الذكي إلى 3 ملفات...';try{const selected=document.getElementById('storyModel')?.value||`xkiro:${getXKiroModel()}`;const raw=await callAI(storyJsonPrompt(source.text,source.images.length),'story',{model:selected,max_tokens:16000});const data=normalizeStoryData(storyCleanJson(raw));window.__storyData=data;addProjectRecord('story',data.title||'قصة جديدة',`قصة مقسمة إلى ${data.dialogue_and_prompts.length} مشاهد، ${data.characters.length} شخصيات، ${data.locations.length} أماكن`,{createdAt:new Date().toISOString(),data});status.textContent=`✅ اكتملت المعالجة: ${data.dialogue_and_prompts.length} مشاهد، ${data.characters.length} شخصيات، ${data.locations.length} أماكن.`;result.innerHTML=`<section class="panel" style="margin-top:18px"><h3>✅ القصة اتقسمت مثل المخرج الذكي</h3><p class="muted">${escapeHtml(data.title||'القصة')} — ${escapeHtml(data.genre||'')} — ${escapeHtml(data.duration||'غير محددة')}</p><div class="files" style="margin-top:16px"><div class="file"><span>🎬 <b>01 — الحوار والبرومبتات</b><span>${data.dialogue_and_prompts.length} مشاهد — الحوار + Image Prompts + Video Prompts</span></span><span class="actions"><button class="secondary" onclick="openStoryFile('scenes')">فتح</button><button class="primary" onclick="downloadTextFile('01-dialogue-prompts.txt',storyScenesText(window.__storyData))">TXT</button></span></div><div class="file"><span>👤 <b>02 — الشخصيات</b><span>${data.characters.length} شخصيات</span></span><span class="actions"><button class="secondary" onclick="openStoryFile('characters')">فتح</button><button class="primary" onclick="downloadTextFile('02-characters.txt',storyCharactersText(window.__storyData))">TXT</button></span></div><div class="file"><span>🌍 <b>03 — الأماكن</b><span>${data.locations.length} أماكن</span></span><span class="actions"><button class="secondary" onclick="openStoryFile('locations')">فتح</button><button class="primary" onclick="downloadTextFile('03-locations.txt',storyLocationsText(window.__storyData))">TXT</button></span></div></div><div class="director-actions" style="margin-top:18px"><button class="director-action" onclick="openStoryFile('scenes')">🎬 الحوار والبرومبتات<small>كل المشاهد والحوار والصور والفيديو</small></button><button class="director-action" onclick="openStoryFile('characters')">👤 الشخصيات<small>الأوصاف والبرومبتات</small></button><button class="director-action" onclick="openStoryFile('locations')">🌍 الأماكن<small>التفاصيل والبرومبتات</small></button></div><div class="actions"><button class="secondary" onclick="downloadTextFile('alhilal-story-project.json',JSON.stringify(window.__storyData,null,2))">💾 حفظ المشروع JSON</button></div></section>`}catch(e){status.textContent='';result.innerHTML=`<section class="panel" style="margin-top:18px"><h3>🔴 تعذر تحليل القصة</h3><p>${escapeHtml(e.message)}</p></section>`}}
function openStoryFile(kind){const d=window.__storyData;if(!d)return;let title,body;if(kind==='scenes'){title='الحوار والبرومبتات';body=storyScenesText(d)}else if(kind==='characters'){title='الشخصيات';body=storyCharactersText(d)}else{title='الأماكن';body=storyLocationsText(d)}document.getElementById('storyViewer')?.remove();const v=document.createElement('div');v.className='viewer';v.id='storyViewer';v.innerHTML=`<div class="viewer-card"><div class="viewer-head"><h3>${escapeHtml(title)}</h3><button class="viewer-close" type="button" id="svClose">إغلاق</button></div><div class="viewer-body"><div class="viewer-section"><pre class="viewer-pre">${escapeHtml(body)}</pre></div><div class="mini-actions"><button type="button" class="gold" id="svDownload">💾 تنزيل الملف</button><button type="button" id="svPrint">🖨️ طباعة / PDF</button></div></div></div>`;document.body.appendChild(v);v.addEventListener('click',e=>{if(e.target===v)v.remove()});v.querySelector('#svClose').onclick=()=>v.remove();v.querySelector('#svDownload').onclick=()=>downloadTextFile(kind+'-alhilal.txt',body);v.querySelector('#svPrint').onclick=()=>printStoryFile(title,body)}
function printStoryFile(title,body){const w=window.open('','_blank');if(!w){alert('المتصفح منع نافذة الطباعة. اسمح بالنوافذ المنبثقة ثم جرّب مرة أخرى.');return}w.document.write(`<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${escapeHtml(title)}</title><style>body{font-family:Tahoma,Arial;padding:35px;line-height:1.9}pre{white-space:pre-wrap;font-family:Tahoma,Arial}</style></head><body><h1>${escapeHtml(title)}</h1><pre>${escapeHtml(body)}</pre><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}

function audioDataUrl(b64,mime){mime=String(mime||'audio/wav');if(/L16|pcm/i.test(mime)){const rate=Number((mime.match(/rate=(\d+)/i)||[])[1])||24000;const bin=atob(b64),pcm=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)pcm[i]=bin.charCodeAt(i);const h=new ArrayBuffer(44),v=new DataView(h);const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+pcm.length,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,pcm.length,true);return URL.createObjectURL(new Blob([h,pcm],{type:'audio/wav'}))}return 'data:'+mime+';base64,'+b64}

function buildVoiceInput(){const text=(document.getElementById('voiceText')?.value||'').trim();const style=(document.getElementById('voiceStyle')?.value||'').trim();const multi=document.getElementById('voiceMulti')?.checked; if(!multi)return [{type:'user_input',content:[{type:'text',text,annotations:[{type:'speech_metadata',style}]}]}]; const s1=(document.getElementById('speaker1')?.value||'أحمد').trim(),s2=(document.getElementById('speaker2')?.value||'ليلى').trim(); const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean); const content=lines.map(line=>{const m=line.match(/^([^:：]{1,40})\s*[:：]\s*(.+)$/);if(m){const speaker=m[1].trim(),body=m[2].trim();return {type:'text',text:body,annotations:[{type:'speech_metadata',speaker,style}]};}return {type:'text',text:line,annotations:[{type:'speech_metadata',style}]};}); return [{type:'user_input',content}]} 
async function legacy_generateVoiceOver(){const text=(document.getElementById('voiceText')?.value||'').trim();const status=document.getElementById('voiceStatus');const result=document.getElementById('voiceResult');const btn=document.getElementById('voiceGenerateBtn');if(!text){status.textContent='🔴 اكتب النص أولًا.';return}if(btn){btn.disabled=true;btn.textContent='⏳ جاري إنشاء التعليق الصوتي...'}status.textContent='⏳ جاري إنشاء التعليق الصوتي...';result.style.display='none';try{const payload={model:document.getElementById('voiceModel')?.value||'gemini-3.8-flash-tts',input:buildVoiceInput(),response_format:{type:'audio'},generation_config:{speech_config:document.getElementById('voiceMulti')?.checked?{mode:'conversational',speakers:[{speaker:(document.getElementById('speaker1')?.value||'أحمد').trim(),voice:document.getElementById('speakerVoice1')?.value||'Kore'},{speaker:(document.getElementById('speaker2')?.value||'ليلى').trim(),voice:document.getElementById('speakerVoice2')?.value||'Aoede'}]}:[{voice:document.getElementById('voiceName')?.value||'Kore'}]}};let data=null;let serverErr='';try{const sr=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(sr.ok)data=await sr.json();else serverErr=(await sr.json().catch(()=>({})))?.error||'server unavailable'}catch(e){serverErr='server unavailable'}if(!data?.audioBase64){const key=getGeminiKey();if(!key)throw new Error('الخادم غير متصل، ولم يتم العثور على مفتاح Gemini محفوظ. شغّل server.mjs أو أضف مفتاح Gemini من الإعدادات.');const rr=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(payload)});const rd=await rr.json();if(!rr.ok)throw new Error(rd?.error?.message||'تعذر إنشاء الصوت');data=extractTTSResponse(rd)}if(!data?.audioBase64)throw new Error('لم يصل ملف صوتي من Gemini');const src='data:'+(data.mimeType||'audio/wav')+';base64,'+data.audioBase64;result.style.display='block';result.innerHTML=`<h3>🎧 التعليق الصوتي جاهز</h3><audio controls style="width:100%" src="${src}"></audio><div class="actions" style="margin-top:12px"><a class="primary" href="${src}" download="alhilal-voice.wav" style="text-decoration:none">⬇️ تنزيل WAV</a></div>`;status.textContent='🟢 تم إنشاء التعليق الصوتي بنجاح.';window.__lastVoiceSrc=src;addProjectRecord('voice','تعليق صوتي جديد',`تعليق صوتي ${document.getElementById('voiceModel')?.value||''} — ${text.slice(0,90)}`,{createdAt:new Date().toISOString(),text,voice:document.getElementById('voiceName')?.value||'Kore',model:document.getElementById('voiceModel')?.value||'gemini-3.8-flash-tts'})}catch(e){status.textContent='🔴 فشل إنشاء الصوت: '+e.message;result.style.display='none'}finally{if(btn){btn.disabled=false;btn.textContent='🎙️ إنشاء التعليق الصوتي'}}}
function extractTTSResponse(rd){let audio=null;for(const step of (rd?.steps||[]).slice().reverse()){for(const c of (step?.content||[]).slice().reverse()){if(c?.type==='audio'&&c?.data){audio=c;break}}if(audio)break}if(!audio&&rd?.output_audio?.data)audio=rd.output_audio;return audio?{audioBase64:audio.data,mimeType:audio.mime_type||audio.mimeType||'audio/wav'}:null}

function home(){main.innerHTML=`<section class="hero"><div class="moon"></div><div class="hero-content"><div class="generated-badge">AI CREATIVE STUDIO</div><h1>اصنع فكرتك مع هلال AI</h1><div class="goldline"></div><p>من القصة إلى الصورة والفيديو والتعليق الصوتي — كل أدوات الإبداع في مساحة واحدة، بواجهة عربية حديثة.</p><div class="feature-grid"><div class="feature"><strong>🎨 صور مجانية</strong>أنشئ صورك بدون خصم كوينز.</div><div class="feature"><strong>🎬 فيديو ذكي</strong>توليد فيديو حقيقي عبر LTX.</div><div class="feature"><strong>🎙️ صوت احترافي</strong>تعليق صوتي عربي ولغات متعددة.</div></div><div class="actions" style="justify-content:center;margin-top:26px"><button class="primary" data-nav="studio">ابدأ صناعة المحتوى</button><button class="secondary" data-nav="business">📁 مشاريعي</button></div></div></section>`}
function business(){const cards=state.projects.map((x,i)=>`<article class="skin-project"><h4>${x.icon||'📁'} ${escapeHtml(x.name)}</h4><small>${projectTypeLabel(x.type)} • ${escapeHtml(x.date||'')}</small><p>${escapeHtml(x.desc||'ملف مشروع محفوظ في حسابك')}</p><div class="actions"><button class="secondary" onclick="openProjectRecord(${i})">📂 فتح</button><button class="danger" onclick="deleteProject(${i})">حذف</button></div></article>`).join('');main.innerHTML=`<div class="page-title"><div><h2>💼 أعمالي</h2><p>مشاريعك محفوظة مع حسابك.</p></div><button class="primary" onclick="nav('studio')">+ مشروع جديد</button></div><section class="skin-projects" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px">${cards||`<div class="skin-project" style="grid-column:1/-1;text-align:center"><h3>لا توجد مشاريع بعد</h3><p>ابدأ من الاستوديو وأنشئ أول مشروع لك.</p></div>`}</section>`}
function studio(){main.innerHTML=header('الاستوديو','اختر أداة الإنتاج التي تريد استخدامها')+`<section class="panel"><div class="studio-grid">${tools.map(t=>`<button class="tool" data-tool="${t[0]}"><span class="ico">${t[1]}</span><span><h3>${t[2]}</h3><p>${t[3]}</p></span></button>`).join('')}</div></section>`;document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>nav(b.dataset.tool))}
function render(){let p=state.page;if(p==='home')home();else if(p==='language')language();else if(p==='studio')studio();else if(p==='business')business();else if(p==='points')pointsPage();else if(p==='account')accountPage();else if(p==='settings')settings();else if(p==='chat')chat();else if(p==='director')director();else if(p==='story')story();else if(p==='image')imageGen();else if(p==='video')videoGen();else if(p==='voice')voice();updateLoginUI();applyLocale()}
async function addProjectRecord(type,name,desc,data,icon='📁'){const safeData=stripProjectBinaries(data||null);const rec={id:'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),type,name:name||'مشروع الهلال AI',date:new Date().toLocaleString('ar-EG'),desc:desc||'',icon,data:safeData};state.projects.unshift(rec);try{localStorage.setItem('alhilal_projects',JSON.stringify(state.projects))}catch{}if(currentUser){try{const r=await api('/api/projects',{method:'POST',body:JSON.stringify(rec)});rec.id=r.project?.id||rec.id}catch(e){console.warn('project sync',e)}}return rec}
function getXKiroKey(){return 'server'} function getLtxKey(){return 'server'} function getGeminiKey(){return 'server'} function getXKiroModel(){return 'qwen/qwen3.8-omni-flash:free'} function getLtxModel(){return 'ltx-2-5-pro'}

async function runImageGen(){try{requireLogin()}catch{return}const p=document.getElementById('imgPrompt')?.value.trim();const box=document.getElementById('imgPreview');const ratio=document.getElementById('imgRatio')?.value||'1:1';if(!p){box.textContent='اكتب وصف الصورة أولًا.';return}box.innerHTML='<div class="image-status">⏳ جاري توليد الصورة...</div>';try{const src=await generateImageWithFallback(p,ratio);box.innerHTML=`<img class="ai-image" src="${src}" alt="الصورة المولدة"><div class="mini-actions"><a class="secondary" href="${src}" target="_blank" download="alhilal-image.png">💾 حفظ الصورة</a></div>`;await addProjectRecord('image','صورة مولدة جديدة','صورة مجانية',{createdAt:new Date().toISOString(),prompt:p,ratio,src})}catch(e){box.innerHTML='<div class="image-status">🔴 '+escapeHtml(e.message)+'</div>'}}
function videoGen(){const preset=window.__videoPreset||{};delete window.__videoPreset;main.innerHTML=header('صناعة الفيديو','فيديو عبر LTX — حتى 5 مشاهد ومدة إجمالية مطلوبة حتى 100 ثانية')+`<section class="generator"><div class="preview" id="videoPreview" style="min-height:360px;display:flex;align-items:center;justify-content:center;overflow:hidden">🎬 هنا سيظهر الفيديو</div><div class="controls"><label>وصف الفيديو / المشاهد</label><textarea id="videoPrompt" style="width:100%;min-height:180px;border:1px solid #ffffff18;background:#071326;color:#fff;border-radius:10px;padding:12px" placeholder="اكتب وصف المشهد أو المشهدين والحركة والحوار...">${escapeHtml(preset.prompt||'')}</textarea><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px"><div><label>عدد المشاهد</label><select id="videoSceneCount" style="width:100%;padding:12px;background:#071326;color:#fff;border:1px solid #ffffff18;border-radius:10px"><option value="1" ${preset.sceneCount===1||preset.sceneCount==null?'selected':''}>مشهد واحد</option><option value="2" ${preset.sceneCount===2?'selected':''}>مشهدان</option><option value="3" ${preset.sceneCount===3?'selected':''}>3 مشاهد</option><option value="4" ${preset.sceneCount===4?'selected':''}>4 مشاهد</option><option value="5" ${preset.sceneCount===5?'selected':''}>5 مشاهد</option></select></div><div><label>المدة الكلية</label><select id="videoDuration" style="width:100%;padding:12px;background:#071326;color:#fff;border:1px solid #ffffff18;border-radius:10px"><option value="10" ${preset.duration===10||preset.duration==null?'selected':''}>10 ثوانٍ</option><option value="20" ${preset.duration===20?'selected':''}>20 ثانية</option><option value="30">30 ثانية</option><option value="40" ${preset.duration===40?'selected':''}>40 ثانية</option><option value="60" ${preset.duration===60?'selected':''}>60 ثانية</option><option value="80" ${preset.duration===80?'selected':''}>80 ثانية</option><option value="100" ${preset.duration===100?'selected':''}>100 ثانية — قد يرفضها المزوّد</option></select></div><div><label>نسبة الأبعاد</label><select id="videoRatio" style="width:100%;padding:12px;background:#071326;color:#fff;border:1px solid #ffffff18;border-radius:10px"><option value="16:9">16:9 أفقي</option><option value="9:16">9:16 رأسي</option></select></div><div><label>الدقة</label><select id="videoResolution" style="width:100%;padding:12px;background:#071326;color:#fff;border:1px solid #ffffff18;border-radius:10px"><option value="720p">720p</option><option value="1080p">1080p</option><option value="4k">4K</option></select></div></div><button class="primary" style="margin-top:16px" onclick="generateRealVideo()">🎥 توليد الفيديو — 1 🪙</button><div id="videoStatus" class="panel" style="margin-top:14px">⚪ سيُخصم كوين واحد، ويُعاد تلقائيًا إذا فشل التوليد.</div><p class="muted" style="font-size:12px">ملاحظة: يرسل التطبيق المشاهد كطلب فيديو واحد؛ دمج ملفات فيديو منفصلة فعليًا يحتاج دعمًا من مزوّد التوليد/خدمة مونتاج. قد يرفض مزوّد LTX مدة 100 ثانية إذا كانت خارج حدوده.</p></div></section>`}
async function generateRealVideo(){try{requireLogin()}catch{return}const prompt=(document.getElementById('videoPrompt')?.value||'').trim(),status=document.getElementById('videoStatus'),preview=document.getElementById('videoPreview');if(!prompt){status.textContent='🔴 اكتب وصف الفيديو أولًا.';return}status.textContent='⏳ جاري بدء الفيديو...';preview.innerHTML='🎬 جاري التوليد...';try{const sceneCount=Math.min(5,Math.max(1,Number(document.getElementById('videoSceneCount')?.value||5))),ratio=document.getElementById('videoRatio')?.value||'16:9',duration=Math.min(100,Math.max(1,Number(document.getElementById('videoDuration')?.value||100))),r0=document.getElementById('videoResolution')?.value||'720p';const resolution=r0==='4k'?(ratio==='9:16'?'2160x3840':'3840x2160'):(r0==='1080p'?(ratio==='9:16'?'1080x1920':'1920x1080'):(ratio==='9:16'?'720x1280':'1280x720'));const d=await api('/api/ltx/video',{method:'POST',body:JSON.stringify({prompt:(sceneCount>1?`أنشئ تسلسلًا واحدًا من ${sceneCount} مشاهد متتابعة ومتصلة بصريًا. المدة الإجمالية المطلوبة ${duration} ثانية. وزّع الوقت بالتساوي تقريبًا بين المشاهد، مع انتقالات واضحة وثبات الشخصيات والمكان والأسلوب.\n\n${prompt}`:prompt),model:'ltx-2-5-pro',duration,resolution})});if(window.__member)window.__member.points=d.points;points.textContent=d.points;if(!d.id)throw new Error('LTX لم يُرجع رقم مهمة.');let job=d,fails=0;for(let i=0;i<180;i++){if(job.status==='completed')break;if(job.status==='failed'){if(job.points!=null){points.textContent=job.points;if(window.__member)window.__member.points=job.points}const em=typeof job.error==='string'?job.error:job?.error?.message;throw new Error((em||'فشل توليد الفيديو.')+(job.refunded?' — تم إرجاع الكوين.':''))}status.textContent=`⏳ جاري التوليد... ${job.status||'processing'}`;await new Promise(r=>setTimeout(r,5000));try{job=await api('/api/ltx/job',{method:'POST',body:JSON.stringify({jobId:d.id})});fails=0}catch(e){if(++fails>=5)throw e}}if(job.status!=='completed')throw new Error('انتهت مهلة الانتظار.');const url=job?.result?.video_url;if(!url)throw new Error('اكتمل التوليد بدون رابط فيديو.');preview.innerHTML=`<video controls autoplay playsinline style="width:100%;max-height:560px;border-radius:16px;background:#000" src="${url}"></video><div style="margin-top:12px;text-align:center"><a class="primary" href="${url}" target="_blank" download="alhilal-video.mp4" style="display:inline-block;text-decoration:none">⬇️ تنزيل MP4</a></div>`;status.textContent='🟢 تم إنشاء الفيديو بنجاح.';await addProjectRecord('video','فيديو مولد جديد','فيديو LTX — 1 كوين',{createdAt:new Date().toISOString(),prompt,sceneCount,model:'ltx-2-5-pro',duration,resolution})}catch(e){status.textContent='🔴 '+e.message;await syncAccount()}}
async function generateVoiceOver(){try{requireLogin()}catch{return}const text=(document.getElementById('voiceText')?.value||'').trim(),status=document.getElementById('voiceStatus'),result=document.getElementById('voiceResult'),btn=document.getElementById('voiceGenerateBtn');if(!text){status.textContent='🔴 اكتب النص أولًا.';return}btn.disabled=true;status.textContent='⏳ جاري إنشاء الصوت — 1 كوين...';result.style.display='none';try{const payload={model:document.getElementById('voiceModel')?.value||'gemini-3.8-flash-tts',input:buildVoiceInput(),response_format:{type:'audio'},generation_config:{speech_config:document.getElementById('voiceMulti')?.checked?{mode:'conversational',speakers:[{speaker:(document.getElementById('speaker1')?.value||'أحمد').trim(),voice:document.getElementById('speakerVoice1')?.value||'Kore'},{speaker:(document.getElementById('speaker2')?.value||'ليلى').trim(),voice:document.getElementById('speakerVoice2')?.value||'Aoede'}]}:[{voice:document.getElementById('voiceName')?.value||'Kore'}]}};const d=await api('/api/tts',{method:'POST',body:JSON.stringify(payload)});if(window.__member)window.__member.points=d.points;points.textContent=d.points;if(!d.audioBase64)throw new Error('لم يصل ملف صوتي.');const src=audioDataUrl(d.audioBase64,d.mimeType);result.style.display='block';result.innerHTML=`<h3>🎧 التعليق الصوتي جاهز</h3><audio controls style="width:100%" src="${src}"></audio><div class="actions"><a class="primary" href="${src}" download="alhilal-voice.wav">⬇️ تنزيل WAV</a></div>`;status.textContent='🟢 تم إنشاء التعليق الصوتي بنجاح.';await addProjectRecord('voice','تعليق صوتي جديد','تعليق صوتي — 1 كوين',{createdAt:new Date().toISOString(),text,voice:document.getElementById('voiceName')?.value||'Kore',model:payload.model})}catch(e){status.textContent='🔴 '+e.message;await syncAccount()}finally{btn.disabled=false}}
async function deleteProject(i){const p=state.projects[i];if(!p)return;state.projects.splice(i,1);try{localStorage.setItem('alhilal_projects',JSON.stringify(state.projects))}catch{}if(currentUser&&p.id){try{await api('/api/projects/'+encodeURIComponent(p.id),{method:'DELETE'})}catch(e){console.warn(e)}}render()}

  if(!currentUser){main.innerHTML=header('⚙️ لوحة الإدارة','تسجيل الدخول مطلوب')+`<section class="panel"><p>سجّل الدخول أولًا.</p><button class="primary" onclick="openLogin()">تسجيل الدخول</button></section>`;return}
  if(!window.__member?.admin){main.innerHTML=header('⚙️ لوحة الإدارة','للمالك فقط')+`<section class="panel"><h3>🔒 هذه الصفحة مقفولة</h3><p class="muted">هذه الصفحة متاحة لحساب المالك فقط.</p></section>`;return}

async function adminTestChat(kind){const out=document.getElementById('adminTestOut');out.style.display='block';out.textContent='⏳ جاري الاختبار...';try{const r=await api('/api/ai/chat',{method:'POST',body:JSON.stringify({prompt:'رد بكلمة واحدة فقط: تمام',model:kind==='gemini'?'gemini:'+getGeminiModel():'xkiro:'+getXKiroModel()})});out.textContent='🟢 '+(kind==='gemini'?'Gemini':'xKiro')+' يعمل. الرد: '+String(r.reply||'').slice(0,120)}catch(e){out.textContent='🔴 '+e.message}}
async function adminTestImage(){const out=document.getElementById('adminTestOut');out.style.display='block';out.textContent='⏳ جاري توليد صورة اختبار...';try{const r=await api('/api/image/generate',{method:'POST',body:JSON.stringify({prompt:'a glowing crescent moon over a desert at night, no text, no logos',size:'1024x1024'})});window.__adminImg=r.url;out.innerHTML='🟢 نجح توليد الصورة. <button type="button" class="secondary" onclick="window.open(window.__adminImg,\'_blank\')">عرض الصورة</button>'}catch(e){out.textContent='🔴 '+e.message}}
async function loadAdminPayments(){const box=document.getElementById('adminPayments');if(!box)return;try{const d=await api('/api/admin/payments');const list=(d.payments||[]).slice(0,100);if(!list.length){box.innerHTML='<p class="muted">لا توجد طلبات دفع بعد.</p>';return}const lab={pending:'⏳ قيد المراجعة',approved:'✅ مقبول',rejected:'❌ مرفوض'};box.innerHTML=list.map(p=>`<div class="file" style="margin-bottom:8px"><span><b>${Number(p.coins).toLocaleString('en-US')} كوين — ${p.price} جنيه</b><span>${escapeHtml(p.email||p.uid)} · رقم العملية: <code>${escapeHtml(p.transactionRef)}</code> · ${escapeHtml(new Date(p.createdAt).toLocaleString('ar-EG'))}</span></span><span class="actions">${p.status==='pending'?`<button type="button" class="primary" data-pay="${escapeHtml(p.id)}" data-approve="1">✅ قبول</button><button type="button" class="danger" data-pay="${escapeHtml(p.id)}" data-approve="0">رفض</button>`:`<span class="generated-badge">${lab[p.status]||escapeHtml(p.status)}</span>`}</span></div>`).join('');box.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>reviewAdminPayment(b.dataset.pay,b.dataset.approve==='1',b))}catch(e){box.textContent='🔴 '+e.message}}
async function reviewAdminPayment(id,approve,btn){if(!confirm(approve?'تأكيد قبول الدفع وإضافة الكوينز للمستخدم؟':'تأكيد رفض الطلب؟'))return;btn.disabled=true;try{await api('/api/admin/payments/approve',{method:'POST',body:JSON.stringify({id,approve})});await loadAdminPayments()}catch(e){alert(e.message);btn.disabled=false}}
async function refreshApiHealth(){const box=document.getElementById('serverApiHealth');if(!box)return;box.textContent='⏳ جاري الفحص...';try{const d=await api('/api/health');box.innerHTML=`<div style="display:grid;gap:8px;margin-top:10px"><div>${d.geminiConfigured?'🟢':'🔴'} Gemini API: ${d.geminiConfigured?'مضبوط على السيرفر':'غير مضبوط — أضف GEMINI_API_KEY في إعدادات الاستضافة'}</div><div>${d.xkiroConfigured?'🟢':'🔴'} xKiro API: ${d.xkiroConfigured?'مضبوط على السيرفر':'غير مضبوط — أضف XKIRO_API_KEY في إعدادات الاستضافة'}</div><div>${d.ltxConfigured?'🟢':'🔴'} LTX API: ${d.ltxConfigured?'مضبوط على السيرفر':'غير مضبوط — أضف LTX_API_KEY في إعدادات الاستضافة'}</div><div>${d.googleReady?'🟢':'🟡'} تسجيل الدخول بجوجل: ${d.googleReady?'مفعّل':'غير مفعّل — يحتاج FIREBASE_WEB_API_KEY وFIREBASE_AUTH_DOMAIN وFIREBASE_APP_ID'}</div><div>${d.persistentStorage?'🟢':'🟡'} التخزين: ${d.persistentStorage?'Firebase متصل':'تخزين محلي على السيرفر (قد يضيع عند إعادة النشر — فعّل Firebase)'}</div></div>`}catch(e){box.textContent='🔴 تعذّر فحص السيرفر: '+e.message}}
